    <script>
        function changeLanguage(language) {
            // Bu fonksiyon dil değişikliği işlemini gerçekleştirecek
            if (language === 'en') {
                console.log("Language changed to English");
                // Dil değişikliğine yönelik kodlarınızı buraya ekleyin
            } else if (language === 'tr') {
                console.log("Dil Türkçe'ye değiştirildi");
                // Dil değişikliğine yönelik kodlarınızı buraya ekleyin
            }
        }
    </script>
    <script>
        var map = L.map('map').setView([37.2153, 28.3636], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        function createCustomIcon(color) {
            return L.divIcon({
                className: 'custom-marker',
                html: '<div style="background-color:' + color + '"></div>',
                iconSize: [20, 20],
                iconAnchor: [10, 10],
                popupAnchor: [0, -10]
            });
        }

        // Adding markers with custom colors for different cities
        var markers = [
            { coords: [36.8969, 30.7133], popup: "<b>X coin</b>", color: 'red' },    // Antalya
            { coords: [37.2153, 28.3636], popup: "<b>Y coin</b>", color: 'blue' },     // Muğla
            { coords: [37.7833, 29.0904], popup: "<b>Z coin</b>", color: 'green' },  // Denizli
            { coords: [39.9334, 32.8597], popup: "<b>M coin</b>", color: 'purple' }   // Ankara
        ];

        markers.forEach(function(marker) {
            L.marker(marker.coords, { icon: createCustomIcon(marker.color) }).addTo(map)
                .bindPopup(marker.popup);
        });

    </script>
