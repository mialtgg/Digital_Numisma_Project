{% load static %}
<!doctype html>
<html lang="en" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg" data-sidebar-image="none">
<head>
    <meta charset="utf-8" />
    <title>CMD NUM | Numisma</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Premium Multipurpose Admin & Dashboard Template" name="description" />
    <meta content="Themesbrand" name="author" />
    <!-- App favicon -->
    <link rel="shortcut icon" href="{% static 'images/favicon.ico' %}">
    <link href="{% static 'libs/jsvectormap/css/jsvectormap.min.css'%}" rel="stylesheet" type="text/css" />
    <!--Swiper slider css-->
    <link href="{% static 'libs/swiper/swiper-bundle.min.css' %}" rel="stylesheet" type="text/css" />
    <!-- Layout config Js -->
    <script src="{% static 'js/layout.js' %}"></script>
    <!-- Bootstrap Css -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" type="text/css" />
    <!-- Icons Css -->
    <link href="{% static 'css/icons.min.css' %}" rel="stylesheet" type="text/css" />
    <!-- App Css-->
    <link href="{% static 'css/app.min.css' %}" rel="stylesheet" type="text/css" />
    <!-- custom Css-->
    <link href="{% static 'css/custom.min.css' %}" rel="stylesheet" type="text/css" />
    <!-- leaflet Css-->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <!-- flag Css-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons/css/flag-icons.min.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        #map-container {
            position: relative;
        }
        #map2 {
            height: 700px;
            width: 100%;
        }
        
        .navbar-nav .nav-item .badge {
            position: absolute;
            top: 0;
            right: -10px;
            transform: translateY(-50%);
            font-size: 0.75rem; /* Adjust the font size as needed */
            background-color: #333; /* Dark gray color */
            color: #fff; /* White text color */
        }

        .custom-marker {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #ff7800; /* Varsayılan renk */
            border: 2px solid white;
            display: inline-block;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .legend-color-box {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="layout-wrapper landing">
        {% include 'partials/topbar.html' %}
        {% include 'partials/sub-topbar.html' %}
        <div id="map-container">
            <div id="map2"></div>
            <div class="card legend-card">
                <div class="card-body">
                    <div class="legend-item">
                        <div class="legend-color-box" style="background-color: #ff0000;"></div>
                        <span>Hoard</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color-box" style="background-color: #00ff00;"></div>
                        <span>Single Find</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color-box" style="background-color: #0000ff;"></div>
                        <span>Grave</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color-box" style="background-color: #800080;"></div>
                        <span>Seal</span>
                    </div>
                    <!-- Add more legend items as needed -->
                </div>
            </div>
        </div>
    </div>
    <!-- JAVASCRIPT -->
    <script src="{% static 'libs/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'libs/simplebar/simplebar.min.js' %}"></script>
    <script src="{% static 'libs/node-waves/waves.min.js' %}"></script>
    <script src="{% static 'libs/feather-icons/feather.min.js' %}"></script>
    <script src="{% static 'js/pages/plugins/lord-icon-2.1.0.js' %}"></script>
    <script src="{% static 'js/plugins.js' %}"></script>
    <!--Swiper slider js-->
    <script src="{% static 'libs/swiper/swiper-bundle.min.js' %}"></script>
    <!--job landing init -->
    <script src="{% static 'js/pages/job-lading.init.js' %}"></script>
    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <!-- prismjs plugin -->
    <script src="{% static 'libs/prismjs/prism.js'%}"></script>
    <script>
        function changeLanguage(language) {
            // Bu fonksiyon dil değişikliği işlemini gerçekleştirecek
            if (language === 'en') {
                console.log("Language changed to English");
                // Dil değişikliğine yönelik kodlarınızı buraya ekleyin
            } else if (language === 'tr') {
                console.log("Dil Türkçe'ye değiştirildi");
                // Dil değişikliğine yönelik kodlarınızı buraya ekleyin
            }
        }
    </script>
    <script>
        // Harita başlatma
        var map = L.map('map2').setView([37.2153, 28.3636], 6);

        // Harita katmanı
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Şehirler
        var points = [
        { coords: [41.0082, 28.9784], name: "İstanbul", color: '#ff0000' },  // İstanbul
        { coords: [39.9334, 32.8597], name: "Ankara", color: '#00ff00' },    // Ankara
        { coords: [38.4192, 27.1287], name: "İzmir", color: '#0000ff' },      // İzmir
        { coords: [37.7833, 29.0904], name: "Denizli", color: '#800080' },   // Denizli
        { coords: [36.8969, 30.7133], name: "Antalya", color: '#ffa500' },   // Antalya
        { coords: [41.0151, 28.9794], name: "Kocaeli", color: '#ff69b4' },   // Kocaeli
        { coords: [40.7128, 29.0825], name: "Bursa", color: '#00ffff' },     // Bursa
        { coords: [39.6384, 32.8597], name: "Eskişehir", color: '#ff4500' }, // Eskişehir
        { coords: [37.3700, 40.7128], name: "Gaziantep", color: '#006400' }, // Gaziantep
        { coords: [39.9334, 32.8597], name: "Konya", color: '#a52a2a' }     // Konya
        ];

        // Noktaları ve çizgileri ekleme
        var polyline = [];
        points.forEach(function(point, index) {
            var marker = L.marker(point.coords, {
                icon: L.divIcon({
                    className: 'custom-marker',
                    html: '<div style="background-color:' + point.color + '"></div>',
                    iconSize: [20, 20],
                    iconAnchor: [10, 10],
                    popupAnchor: [0, -10]
                })
            }).addTo(map)
            .bindPopup("<b>" + point.name + "</b>");
            
            if (index > 0) {
                L.polyline([points[index - 1].coords, point.coords], { color: 'blue' }).addTo(map);
            }

            polyline.push(marker);
        });

        // Aralarındaki tüm noktaları bağlayan çizgi
        L.polyline(points.map(point => point.coords), { color: 'blue' }).addTo(map);
    </script>
    <script>
        // Initialization for ES Users
        import { Dropdown, Collapse, initMDB } from "mdb-ui-kit";
        initMDB({ Dropdown, Collapse });
    </script>
</body>
</html>
